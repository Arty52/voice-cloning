[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "voice-transcription"
version = "0.1.0"
requires-python = ">=3.12"
description = "Local transcription contracts, evaluation, and native inference worker."
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/voice_transcription"]

[project.optional-dependencies]
worker = ["fastapi>=0.124,<1", "uvicorn>=0.38,<1"]
mac = ["parakeet-mlx==0.7.0", "mlx-whisper==0.4.3", "huggingface-hub>=0.30,<2", "soundfile>=0.13,<1", "numpy>=2.2,<3", "silero-vad>=6,<7", "pyannote.audio>=4.0.5,<5"]

[project.scripts]
voice-transcription-worker = "voice_transcription.cli:main"
